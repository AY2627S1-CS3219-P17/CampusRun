# Local development / demo only; cloud deployments are configured separately.
# Values in ${...} are read from the root .env file.

services:
  user-db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${USER_DB_USER:-user_service}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:?set USER_DB_PASSWORD in .env}
      POSTGRES_DB: ${USER_DB_NAME:-user_service}
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql (not .../data)
      - user-db-data:/var/lib/postgresql
    ports:
      # Bound to localhost only, for running the API or Alembic on the host
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-off: applies Alembic migrations, then exits
  user-migrate:
    build: ./user-service
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${USER_DB_USER:-user_service}:${USER_DB_PASSWORD:?set USER_DB_PASSWORD in .env}@user-db:5432/${USER_DB_NAME:-user_service}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    depends_on:
      user-db:
        condition: service_healthy

  # One-off: creates the first admin from INITIAL_ADMIN_* after migrations, then exits.
  # Skips when the variables are unset or an admin already exists. user-service doesn't wait for it,
  # so a bad value only fails this container, and the admin password never reaches the server.
  user-seed-admin:
    build: ./user-service
    command: ["create-initial-admin", "--skip-if-unset"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${USER_DB_USER:-user_service}:${USER_DB_PASSWORD:?set USER_DB_PASSWORD in .env}@user-db:5432/${USER_DB_NAME:-user_service}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
    depends_on:
      user-migrate:
        condition: service_completed_successfully

  user-service:
    build: ./user-service
    environment:
      # Hostname is the Compose service name, resolved on the project's private network
      DATABASE_URL: postgresql+asyncpg://${USER_DB_USER:-user_service}:${USER_DB_PASSWORD:?set USER_DB_PASSWORD in .env}@user-db:5432/${USER_DB_NAME:-user_service}
      # Local only: deployed environments leave this unset, so the docs are off
      ENABLE_DOCS: "true"
      ROOT_PATH: "/api/users"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-60}
      # For the outbox relay that sends OpenWallet to the credit service. user-service deliberately doesn't wait
      # for RabbitMQ: registration works without it and the messages wait in the outbox.
      RABBITMQ_URL: amqp://user-service:${RABBITMQ_USER_SERVICE_PASSWORD:?set RABBITMQ_USER_SERVICE_PASSWORD in .env}@rabbitmq:5672/
    depends_on:
      # Start only after migrations have finished successfully
      user-migrate:
        condition: service_completed_successfully
      
  supplier-db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${SUPPLIER_DB_USER:-supplier_service}
      POSTGRES_PASSWORD: ${SUPPLIER_DB_PASSWORD:?set SUPPLIER_DB_PASSWORD in .env}
      POSTGRES_DB: ${SUPPLIER_DB_NAME:-supplier_service}
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql (not .../data)
      - supplier-db-data:/var/lib/postgresql
    ports:
      # Bound to localhost only; 5434 because user-db already uses 5433
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  
  supplier-migrate:
    build: ./supplier-service
    command: ["sh", "-c", "alembic upgrade head && python -m supplier_service.seed"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${SUPPLIER_DB_USER:-supplier_service}:${SUPPLIER_DB_PASSWORD:?set SUPPLIER_DB_PASSWORD in .env}@supplier-db:5432/${SUPPLIER_DB_NAME:-supplier_service}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    depends_on:
      supplier-db:
        condition: service_healthy
  
  supplier-service:
    build: ./supplier-service
    environment:
      DATABASE_URL: postgresql+asyncpg://${SUPPLIER_DB_USER:-supplier_service}:${SUPPLIER_DB_PASSWORD:?set SUPPLIER_DB_PASSWORD in .env}@supplier-db:5432/${SUPPLIER_DB_NAME:-supplier_service}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ORIGINS: http://localhost:5173
      # Local only: deployed environments leave this unset, so the docs are off
      ENABLE_DOCS: "true"
      ROOT_PATH: "/api/suppliers"
    depends_on:
      supplier-migrate:
        condition: service_completed_successfully

  order-db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${ORDER_DB_USER:-order_service}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:?set ORDER_DB_PASSWORD in .env}
      POSTGRES_DB: ${ORDER_DB_NAME:-order_service}
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql (not .../data)
      - order-db-data:/var/lib/postgresql
    ports:
      # Bound to localhost only; 5436 because the other databases use 5433 to 5435
      - "127.0.0.1:5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-off: applies Alembic migrations and loads the predefined delivery locations (if not already there), then exits
  order-migrate:
    build: ./order-service
    command: ["sh", "-c", "alembic upgrade head && python -m order_service.seed"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${ORDER_DB_USER:-order_service}:${ORDER_DB_PASSWORD:?set ORDER_DB_PASSWORD in .env}@order-db:5432/${ORDER_DB_NAME:-order_service}
    depends_on:
      order-db:
        condition: service_healthy

  # HTTP API: errands and AI autofill. It never connects to RabbitMQ: credit commands go into the outbox table,
  # and order-worker publishes them, so errands can be created while the broker is down.
  order-service:
    build: ./order-service
    environment:
      DATABASE_URL: postgresql+asyncpg://${ORDER_DB_USER:-order_service}:${ORDER_DB_PASSWORD:?set ORDER_DB_PASSWORD in .env}@order-db:5432/${ORDER_DB_NAME:-order_service}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      SUPPLIER_SERVICE_URL: http://supplier-service:8000
      USER_SERVICE_URL: http://user-service:8000
      CREDIT_API_URL: http://credit-service:8000
      # Local only: deployed environments leave this unset, so the docs are off
      ENABLE_DOCS: "true"
      ROOT_PATH: "/api/orders"
    depends_on:
      order-migrate:
        condition: service_completed_successfully
      supplier-service:
        condition: service_started

  # Publishes the outbox, applies the credit service's replies and expires errands. Same image as the API,
  # different process, like credit-worker.
  order-worker:
    build: ./order-service
    command: ["order-worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${ORDER_DB_USER:-order_service}:${ORDER_DB_PASSWORD:?set ORDER_DB_PASSWORD in .env}@order-db:5432/${ORDER_DB_NAME:-order_service}
      RABBITMQ_URL: amqp://order-service:${RABBITMQ_ORDER_SERVICE_PASSWORD:?set RABBITMQ_ORDER_SERVICE_PASSWORD in .env}@rabbitmq:5672/
    # A crash leaves its messages unacknowledged, so RabbitMQ hands them to the restarted worker
    restart: unless-stopped
    depends_on:
      order-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  # Message broker for the commands that change credit balances (official image, unchanged; see
  # docs/credit-service-plan.md). provision.sh creates one login per service and loads definitions.json:
  # the queues, exchanges, dead-lettering and what each login may send.
  rabbitmq:
    image: rabbitmq:4.3.6-management
    # Fixes the node name (rabbit@rabbitmq). RabbitMQ keeps its data under the node name, so a recreated
    # container with a random hostname would start empty and lose the queued messages in the volume.
    hostname: rabbitmq
    entrypoint: ["bash", "/usr/local/bin/campusrun-provision.sh"]
    environment:
      # Created on first boot instead of the default guest/guest account
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_ADMIN_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_ADMIN_PASSWORD:?set RABBITMQ_ADMIN_PASSWORD in .env}
      RABBITMQ_ADMIN_USER: ${RABBITMQ_ADMIN_USER:-admin}
      RABBITMQ_ADMIN_PASSWORD: ${RABBITMQ_ADMIN_PASSWORD:?set RABBITMQ_ADMIN_PASSWORD in .env}
      RABBITMQ_CREDIT_SERVICE_PASSWORD: ${RABBITMQ_CREDIT_SERVICE_PASSWORD:?set RABBITMQ_CREDIT_SERVICE_PASSWORD in .env}
      RABBITMQ_USER_SERVICE_PASSWORD: ${RABBITMQ_USER_SERVICE_PASSWORD:?set RABBITMQ_USER_SERVICE_PASSWORD in .env}
      RABBITMQ_ORDER_SERVICE_PASSWORD: ${RABBITMQ_ORDER_SERVICE_PASSWORD:?set RABBITMQ_ORDER_SERVICE_PASSWORD in .env}
    volumes:
      - ./rabbitmq/provision.sh:/usr/local/bin/campusrun-provision.sh:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      # Queued messages survive the container being stopped, restarted or recreated
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      # Bound to localhost only: AMQP for services run on the host, and the management UI at http://localhost:15672
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      # Healthy only once provision.sh has created the logins and queues
      test: ["CMD-SHELL", "test -f /tmp/campusrun-ready && rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  credit-db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${CREDIT_DB_USER:-credit_service}
      POSTGRES_PASSWORD: ${CREDIT_DB_PASSWORD:?set CREDIT_DB_PASSWORD in .env}
      POSTGRES_DB: ${CREDIT_DB_NAME:-credit_service}
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql (not .../data)
      - credit-db-data:/var/lib/postgresql
    ports:
      # Bound to localhost only; 5435 because user-db and supplier-db use 5433 and 5434
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-off: applies Alembic migrations, then exits
  credit-migrate:
    build: ./credit-service
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${CREDIT_DB_USER:-credit_service}:${CREDIT_DB_PASSWORD:?set CREDIT_DB_PASSWORD in .env}@credit-db:5432/${CREDIT_DB_NAME:-credit_service}
    depends_on:
      credit-db:
        condition: service_healthy

  # Read-only HTTP API: wallets, history, reservations, audit
  credit-service:
    build: ./credit-service
    environment:
      DATABASE_URL: postgresql+asyncpg://${CREDIT_DB_USER:-credit_service}:${CREDIT_DB_PASSWORD:?set CREDIT_DB_PASSWORD in .env}@credit-db:5432/${CREDIT_DB_NAME:-credit_service}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # Local only: deployed environments leave this unset, so the docs are off
      ENABLE_DOCS: "true"
      ROOT_PATH: "/api/credits"
    depends_on:
      credit-migrate:
        condition: service_completed_successfully

  # Applies every balance change, from the commands on RabbitMQ. Same image as the API, different process,
  # so the two scale and restart independently. Run more copies with `docker compose up --scale credit-worker=3`.
  credit-worker:
    build: ./credit-service
    command: ["credit-worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${CREDIT_DB_USER:-credit_service}:${CREDIT_DB_PASSWORD:?set CREDIT_DB_PASSWORD in .env}@credit-db:5432/${CREDIT_DB_NAME:-credit_service}
      RABBITMQ_URL: amqp://credit-service:${RABBITMQ_CREDIT_SERVICE_PASSWORD:?set RABBITMQ_CREDIT_SERVICE_PASSWORD in .env}@rabbitmq:5672/
      INITIAL_CREDITS: ${INITIAL_CREDITS:-100}
    # A crash leaves its message unacknowledged, so RabbitMQ hands it to the restarted worker
    restart: unless-stopped
    depends_on:
      credit-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  # Demo only, not started by `docker compose up`: stands in for the Order Service's errand flow until it's built.
  # docker compose run --rm credit-demo scenario <requester id> <courier id> --pause
  # It logs in as order-service and reads the same reply queue as order-worker, so stop order-worker first
  # (docker compose stop order-worker), or the two split the replies between them.
  credit-demo:
    build: ./credit-service
    entrypoint: ["credit-demo"]
    profiles: ["demo"]
    environment:
      DEMO_RABBITMQ_URL: amqp://order-service:${RABBITMQ_ORDER_SERVICE_PASSWORD:?set RABBITMQ_ORDER_SERVICE_PASSWORD in .env}@rabbitmq:5672/
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CREDIT_API_URL: http://credit-service:8000
      USER_API_URL: http://user-service:8000
    depends_on:
      rabbitmq:
        condition: service_healthy
      credit-service:
        condition: service_started

  # The built web app, served by nginx; reached only through the gateway
  frontend:
    build: ./frontend

  # Public entry point: routes /api/<service>/... to each service on the private network, and everything else to the frontend
  gateway:
    image: nginx:stable-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - user-service
      - supplier-service
      - order-service
      - credit-service
      - frontend

volumes:
  user-db-data:
  supplier-db-data:
  credit-db-data:
  order-db-data:
  rabbitmq-data:
