[tools]
python = "3.14.7"

# tasks below are for local dev
[tasks.credit-db]
description = "Start the database and RabbitMQ for credit-service"
run = "docker compose up -d credit-db rabbitmq"

[tasks.migrate]
description = "Apply database migrations"
run = "uv run alembic upgrade head"

[tasks.serve]
description = "Run the read-only HTTP API on port 8003"
run = "uv run fastapi dev src/credit_service/main.py --port 8003"

[tasks.worker]
description = "Run the RabbitMQ worker that applies balance changes"
run = "uv run credit-worker"

[tasks.audit]
description = "Check that the ledger, balances and reservations agree"
run = "uv run credit-audit"

[tasks.test]
description = "Run the tests (needs credit-db running)"
run = "uv run pytest --cov=credit_service"
