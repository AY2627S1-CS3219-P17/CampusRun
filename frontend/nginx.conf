# Serves the built app inside the frontend container. The gateway forwards every
# non-API request here; API calls never reach this server.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Vite puts a content hash in these file names, so they can be cached for good
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # React Router paths like /explore aren't files, so serve index.html and let the app route them.
    # no-cache makes browsers check for a new index.html, which points at the latest assets.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
