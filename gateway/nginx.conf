# Tool: OpenAI Codex (GPT-6), date: 2026-10-17
# Scope: Routed order-service autofill through the shared gateway with runtime DNS refresh.
# Tool: Claude (claude.ai, model: Claude Opus 5.5), date: 2026-10-17
# Scope: Added the /api/credits/ route to credit-service, re-resolved at runtime like order-service.
# Tool: Claude Code (model: Claude Opus 5.5), date: 2026-10-18
# Scope: Added the exact-match /api/orders route for the errand list and create endpoints at the service root;
#        blocked /api/users/internal/ from outside (2026-10-19);
#        AI-added the per-IP rate limits on sign-in and registration, on AI autofill, and on every request (2026-11-09).
# Author review: <to be completed by author>

# Per client IP, for sign-in and registration: 10 requests a minute, with a burst of 20 (below) so a few typos or a
# shared campus IP don't lock real users out, while password guessing is capped at about 14,400 tries a day per IP.
# 10 MB holds about 160,000 IPs. Behind a cloud load balancer, $binary_remote_addr would be the balancer's address:
# set real_ip_header / set_real_ip_from first.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
# Every request, per client IP: a flood guard, not abuse control. Kept high because many students can share a campus
# IP, and in a local demo every tab shares one, while the errand lists poll every 2 seconds and search as you type.
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
# AI autofill, per client IP: each call uses the shared Groq quota, so one user can't use it up for everyone.
limit_req_zone $binary_remote_addr zone=autofill:10m rate=6r/m;

server {
    listen 80;

    # Resolve rebuilt containers again instead of holding their old IP address.
    resolver 127.0.0.11 valid=10s;
    set $order_service order-service:8000;
    set $credit_service credit-service:8000;

    # Pass the original client details on to the services
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The overall limit for every location below. A location with its own limit_req doesn't inherit this one, so the
    # stricter locations repeat it.
    limit_req zone=api burst=60 nodelay;
    limit_req_status 429;
    # The same {"detail": ...} shape as the services, so the web client shows the message instead of a generic error
    error_page 429 = @too_many_requests;
    location @too_many_requests {
        default_type application/json;
        add_header Retry-After 1 always;
        return 429 '{"detail":"Too many requests. Wait a moment, then try again."}';
    }

    # The trailing slashes strip the prefix: /api/users/auth/login reaches user-service as /auth/login
    location /api/users/ {
        proxy_pass http://user-service:8000/;
    }
    # Internal endpoints (e.g. the username lookup) are only for other services on the private network,
    # which call user-service directly. Longer prefix, so it wins over /api/users/.
    location /api/users/internal/ {
        default_type application/json;
        return 404 '{"detail":"Not Found"}';
    }
    # Each attempt costs an Argon2 hash, so limit both. Exact matches win over the /api/users/ prefix above.
    location = /api/users/auth/login {
        limit_req zone=api burst=60 nodelay;
        limit_req zone=auth burst=20 nodelay;
        error_page 429 = @too_many_attempts;
        proxy_pass http://user-service:8000/auth/login;
    }
    location = /api/users/auth/register {
        limit_req zone=api burst=60 nodelay;
        limit_req zone=auth burst=20 nodelay;
        error_page 429 = @too_many_attempts;
        proxy_pass http://user-service:8000/auth/register;
    }
    location @too_many_attempts {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"detail":"Too many attempts. Wait a minute, then try again."}';
    }
    location /api/suppliers/ {
        proxy_pass http://supplier-service:8000/;
    }
    # Same runtime lookup as orders, so a rebuilt credit-service with a new IP is found without restarting the gateway
    location /api/credits/ {
        rewrite ^/api/credits/(.*)$ /$1 break;
        proxy_pass http://$credit_service;
    }
    # Exact match so /api/suppliers?q=... (no trailing slash) reaches the supplier list at /, instead of the 404 below
    location = /api/suppliers {
        proxy_pass http://supplier-service:8000/;
    }

    # Exact match, so it wins over the /api/orders/ prefix below
    location = /api/orders/autofill {
        limit_req zone=api burst=60 nodelay;
        limit_req zone=autofill burst=3 nodelay;
        error_page 429 = @autofill_limited;
        rewrite ^ /autofill break;
        proxy_pass http://$order_service;
    }
    location @autofill_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"detail":"You have used AI autofill a lot just now. Wait a minute, then try again."}';
    }
    location /api/orders/ {
        rewrite ^/api/orders/(.*)$ /$1 break;
        proxy_pass http://$order_service;
    }
    # Exact match so POST /api/orders and GET /api/orders?page=... (no trailing slash) reach the errand routes at /
    location = /api/orders {
        rewrite ^ / break;
        proxy_pass http://$order_service;
    }

    # Everything else is the web app, so the page and the API share one origin (no CORS)
    location / {
        proxy_pass http://frontend:80;
    }
}