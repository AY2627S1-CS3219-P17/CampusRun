# AI Assistance Disclosure:
# Tool: OpenAI Codex (GPT-6), date: 2026-10-17
# Scope: Routed order-service autofill through the shared gateway with runtime DNS refresh.
# Author review: <to be completed by author>
server {
    listen 80;

    # Resolve rebuilt containers again instead of holding their old IP address.
    resolver 127.0.0.11 valid=10s;
    set $order_service order-service:8000;

    # Pass the original client details on to the services
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The trailing slashes strip the prefix: /api/users/auth/login reaches user-service as /auth/login
    location /api/users/ {
        proxy_pass http://user-service:8000/;
    }
    location /api/suppliers/ {
        proxy_pass http://supplier-service:8000/;
    }
    # Exact match so /api/suppliers?q=... (no trailing slash) reaches the supplier list at /, instead of the 404 below
    location = /api/suppliers {
        proxy_pass http://supplier-service:8000/;
    }

    location /api/orders/ {
        rewrite ^/api/orders/(.*)$ /$1 break;
        proxy_pass http://$order_service;
    }

    # Everything else is the web app, so the page and the API share one origin (no CORS)
    location / {
        proxy_pass http://frontend:80;
    }
}