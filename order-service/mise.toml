[tools]
python = "3.14.7"

# tasks below are for local dev
[tasks.order-db]
description = "Start the database and RabbitMQ for order-service"
run = "docker compose up -d --wait order-db rabbitmq"

[tasks.migrate]
description = "Apply database migrations"
depends = ["order-db"]
run = "uv run alembic upgrade head"

[tasks.serve]
description = "Run the HTTP API on port 8004"
depends = ["migrate"]
run = "uv run fastapi dev src/order_service/main.py --port 8004"

[tasks.worker]
description = "Run the background worker (outbox relay, credit replies, sweeper)"
depends = ["migrate"]
run = "uv run order-worker"

[tasks.test]
description = "Run the tests (needs Docker running for the throwaway Postgres container)"
run = "uv run pytest --cov=order_service"
