[project]
name = "supplier-service"
version = "0.1.0"
description = "CampusRun Supplier Service: campus suppliers and delivery locations"
readme = "README.md"
requires-python = ">=3.14.7"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.141.1",
