[tools]
python = "3.14.7"

# tasks below are for local dev

[tasks.start-db]
description = "Start the local user-service database"
run = "docker compose up -d --wait user-db"

[tasks.migrate]
description = "Apply Alembic migrations to the local database"
depends = ["start-db"]
run = "uv run alembic upgrade head"

[tasks.create-admin]
description = "Create the initial admin in the local database from INITIAL_ADMIN_* in .env"
depends = ["migrate"]
run = "uv run create-initial-admin"

[tasks.serve]
description = "Run the local FastAPI server for user-service"
depends = ["migrate"]
run = "uv run fastapi dev src/user_service/main.py"

[tasks.test]
description = "Run the test suite (needs Docker running for the throwaway Postgres container)"
run = "uv run pytest"
